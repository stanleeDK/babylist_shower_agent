[project]
name = "babylist_shower_agent"
version = "0.1.0"
description = "An AI agent that emails your guests from Gmail and finds a date that works for everyone."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.8",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "cryptography>=43",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",  # FastAPI's TestClient
]

[tool.uv]
package = false  # an app, not a library: nothing to build or install

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
